<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#111827"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bilancio"/>
<title>Bilancio Famiglia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;min-height:100vh;padding-bottom:80px}
input,select,button{font-family:inherit}
::-webkit-scrollbar{display:none}

.header{background:#111827;color:#fff;padding:max(env(safe-area-inset-top),14px) 14px 0;position:sticky;top:0;z-index:10}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px}
.header h1{font-size:17px;font-weight:800}
.header-sub{font-size:11px;color:#6B7280;margin-top:2px}
.hbtns{display:flex;gap:6px}

.tabs-bar{display:flex;overflow-x:auto}
.tab-btn{flex:1;border:none;background:none;color:#9CA3AF;font-size:13px;font-weight:600;padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:#60A5FA;border-bottom-color:#60A5FA}

.body{padding:14px;max-width:600px;margin:0 auto}

.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.card-title{font-weight:700;font-size:15px;margin-bottom:12px}

.saldo-grid{display:flex;gap:10px;margin-bottom:12px}
.saldo-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);flex:1;min-width:0}
.saldo-label{font-size:11px;color:#6B7280;font-weight:700;margin-bottom:2px}
.saldo-val{font-size:22px;font-weight:800;color:#111827;letter-spacing:-0.5px}
.saldo-divider{margin:8px 0;border:none;border-top:1px solid #F3F4F6}
.saldo-eff-label{font-size:10px;color:#9CA3AF}
.saldo-eff{font-size:16px;font-weight:700}
.saldo-dp{font-size:10px;color:#9CA3AF;margin-top:2px}
.green{color:#059669}.red{color:#DC2626}

label.field-label{font-size:12px;color:#6B7280;font-weight:700;display:block;margin-bottom:5px}
input[type=text],input[type=number],input[type=decimal],select{width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:9px;font-size:15px;outline:none;background:#fff}
input:focus,select:focus{border-color:#2563EB}

.btn{border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.btn-blue{background:#2563EB}
.btn-green{background:#059669}
.btn-red{background:#DC2626}
.btn-dark{background:#374151}
.btn-ghost{background:none;border:1.5px solid #E5E7EB;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:#374151}
.btn-sm{padding:7px 11px;font-size:12px}
.btn-xs{padding:5px 9px;font-size:12px}
.btn-full{width:100%;padding:13px;font-size:15px}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.prog-bar-bg{height:8px;background:#F3F4F6;border-radius:99px}
.prog-bar{height:8px;border-radius:99px;transition:width .3s}

.fissa-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #F3F4F6}
.fissa-nome{font-size:14px;font-weight:600;color:#111827}
.fissa-nome.done{color:#9CA3AF;text-decoration:line-through}
.fissa-gg{font-size:11px;color:#9CA3AF}
.fissa-imp{font-weight:700;font-size:14px;color:#374151}
.fissa-imp.done{color:#9CA3AF}
input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:#2563EB;flex-shrink:0}

.mov-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F3F4F6}
.mov-desc{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.mov-date{font-size:10px;color:#9CA3AF}
.mov-imp{font-weight:700;font-size:13px;white-space:nowrap}

.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.badge-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E5E7EB;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav-btn{flex:1;border:none;background:none;padding:10px 0 8px;cursor:pointer;color:#9CA3AF}
.nav-btn.active{color:#2563EB}
.nav-icon{font-size:20px}
.nav-label{font-size:10px;font-weight:500;margin-top:2px}
.nav-btn.active .nav-label{font-weight:700}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end}
.modal-box{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:24px 20px 36px}
.modal-title{font-weight:700;font-size:16px;margin-bottom:8px}
.modal-sub{color:#6B7280;font-size:14px;margin-bottom:20px}

.empty{color:#9CA3AF;font-size:13px}
.section-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#F3F4F6;color:#374151;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.chip.active{background:#2563EB;color:#fff}

.add-fissa-box{margin-top:12px;padding:12px;background:#F9FAFB;border-radius:10px}
.tog-row{display:flex;gap:6px;margin-bottom:12px}
.tog{flex:1;border:none;border-radius:9px;padding:10px;font-size:14px;font-weight:700;cursor:pointer}

.edit-inline{flex:1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.edit-inline input{width:auto;flex:1;min-width:80px;padding:8px 10px;font-size:13px}
.edit-inline input.w-sm{flex:0 0 70px;min-width:0}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── DATI ──────────────────────────────────────────────────────────────────────
const INITIAL = {

    {id:29,data:"2026-06-21",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Benzina",importo:58.85},
    {id:30,data:"2026-06-21",tipo:"USCITA",cat:"Altro",desc:"Claude",importo:219.6},
    {id:31,data:"2026-06-22",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"McDonald's",importo:24.9},
    {id:32,data:"2026-06-23",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:1.85},
    {id:33,data:"2026-06-25",tipo:"USCITA",cat:"Altro",desc:"Prelievo",importo:100},
    {id:34,data:"2026-06-25",tipo:"USCITA",cat:"Salute",desc:"Farmacia",importo:37.68},
    {id:35,data:"2026-06-26",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:10.96},
  ],
  extraMonica:[],
  nextId:{alex:36,monica:1},
};

const CATS=["Cibo/Spesa","Svago/Ristoranti","Trasporti/Auto","Casa/Utenze","Shopping","Salute","Altro"];
const CAT_STYLE={
  "Cibo/Spesa":      {bg:"#FEF3C7",tc:"#92400E",dc:"#F59E0B"},
  "Svago/Ristoranti":{bg:"#EDE9FE",tc:"#5B21B6",dc:"#7C3AED"},
  "Trasporti/Auto":  {bg:"#DBEAFE",tc:"#1E40AF",dc:"#3B82F6"},
  "Casa/Utenze":     {bg:"#D1FAE5",tc:"#065F46",dc:"#10B981"},
  "Shopping":        {bg:"#FCE7F3",tc:"#9D174D",dc:"#EC4899"},
  "Salute":          {bg:"#FEE2E2",tc:"#991B1B",dc:"#EF4444"},
  "Altro":           {bg:"#F3F4F6",tc:"#374151",dc:"#6B7280"},
};
const NAVS=[
  {key:"dash",icon:"🏠",label:"Home"},
  {key:"alex",icon:"👤",label:"Alex"},
  {key:"monica",icon:"👤",label:"Monica"},
  {key:"nuovo",icon:"➕",label:"Nuovo"},
  {key:"storico",icon:"📋",label:"Storico"},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
function loadState(){try{const r=localStorage.getItem("bilancio_v3");if(r)return JSON.parse(r);}catch{}return JSON.parse(JSON.stringify(INITIAL));}
function saveState(s){try{localStorage.setItem("bilancio_v3",JSON.stringify(s));}catch{}}

let S=loadState();
let tab="dash";
let filterCat="Tutte";
let confirmDel=null; // {type,p,id}
let editSaldoMode={Alex:false,Monica:false};
let editSaldoVal={Alex:"",Monica:""};
let showAddFissa=null; // "Alex"|"Monica"|null
let nuovaFissa={nome:"",importo:"",giorno:""};
let editFissa=null; // voce
let formNuovo={persona:"Alex",tipo:"USCITA",cat:"Cibo/Spesa",desc:"",importo:""};

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n);
function oggi(){return new Date().toISOString().split("T")[0];}
function calcola(p){
  const fisse=p==="Alex"?S.fisseAlex:S.fisseMonica;
  const saldo=S.saldi[p];
  const daPagare=fisse.filter(f=>!f.pagato).reduce((a,f)=>a+f.importo,0);
  return{saldo,daPagare,effettivo:+(saldo-daPagare).toFixed(2)};
}
function extraKey(p){return p==="Alex"?"extraAlex":"extraMonica";}
function fisseKey(p){return p==="Alex"?"fisseAlex":"fisseMonica";}
function idKey(p){return p==="Alex"?"alex":"monica";}

// ── AZIONI ────────────────────────────────────────────────────────────────────
function togglePagato(p,id){
  const key=fisseKey(p);
  const voce=S[key].find(f=>f.id===id);
  const delta=voce.pagato?voce.importo:-voce.importo;
  S[key]=S[key].map(f=>f.id===id?{...f,pagato:!f.pagato}:f);
  S.saldi[p]=+(S.saldi[p]-delta).toFixed(2);
  saveState(S);render();
}
function aggiungiExtra(){
  const imp=parseFloat(formNuovo.importo.replace(",","."));
  if(!imp||!formNuovo.desc.trim())return;
  const p=formNuovo.persona;
  const delta=formNuovo.tipo==="USCITA"?-imp:imp;
  S[extraKey(p)].unshift({id:S.nextId[idKey(p)],data:oggi(),tipo:formNuovo.tipo,cat:formNuovo.cat,desc:formNuovo.desc.trim(),importo:imp});
  S.saldi[p]=+(S.saldi[p]+delta).toFixed(2);
  S.nextId[idKey(p)]++;
  formNuovo={...formNuovo,desc:"",importo:""};
  saveState(S);render();
}
function eliminaExtra(p,id){
  const voce=S[extraKey(p)].find(e=>e.id===id);
  if(!voce)return;
  const delta=voce.tipo==="USCITA"?voce.importo:-voce.importo;
  S[extraKey(p)]=S[extraKey(p)].filter(e=>e.id!==id);
  S.saldi[p]=+(S.saldi[p]+delta).toFixed(2);
  confirmDel=null;saveState(S);render();
}
function eliminaFissa(p,id){
  const voce=S[fisseKey(p)].find(f=>f.id===id);
  const delta=voce&&voce.pagato?voce.importo:0;
  S[fisseKey(p)]=S[fisseKey(p)].filter(f=>f.id!==id);
  S.saldi[p]=+(S.saldi[p]+delta).toFixed(2);
  confirmDel=null;saveState(S);render();
}
function aggiornaSaldo(p){
  const v=parseFloat(editSaldoVal[p].replace(",","."));
  if(isNaN(v))return;
  S.saldi[p]=v;
  editSaldoMode[p]=false;
  saveState(S);render();
}
function aggiungiSpesaFissa(p){
  const imp=parseFloat(nuovaFissa.importo.replace(",","."));
  const gio=parseInt(nuovaFissa.giorno);
  if(!nuovaFissa.nome.trim()||isNaN(imp)||isNaN(gio))return;
  S[fisseKey(p)].push({id:S.nextId[idKey(p)],nome:nuovaFissa.nome.trim(),importo:imp,giorno:gio,pagato:false});
  S.nextId[idKey(p)]++;
  nuovaFissa={nome:"",importo:"",giorno:""};
  showAddFissa=null;saveState(S);render();
}
function salvaModFissa(p){
  if(!editFissa)return;
  const imp=parseFloat(String(editFissa.importo).replace(",","."));
  const gio=parseInt(editFissa.giorno);
  if(isNaN(imp)||isNaN(gio)||!editFissa.nome.trim())return;
  S[fisseKey(p)]=S[fisseKey(p)].map(f=>f.id===editFissa.id?{...f,nome:editFissa.nome,importo:imp,giorno:gio}:f);
  editFissa=null;saveState(S);render();
}
function resetMese(p){
  S[fisseKey(p)]=S[fisseKey(p)].map(f=>({...f,pagato:false}));
  saveState(S);render();
}
function esportaJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`bilancio_${oggi()}.json`;a.click();
}
function importaJSON(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{try{S=JSON.parse(ev.target.result);saveState(S);render();}catch{alert("File non valido.");}};
  r.readAsText(file);e.target.value="";
}

// ── HTML BUILDERS ─────────────────────────────────────────────────────────────
function badge(cat){
  const c=CAT_STYLE[cat]||CAT_STYLE["Altro"];
  return `<span class="badge" style="background:${c.bg};color:${c.tc}"><span class="badge-dot" style="background:${c.dc}"></span>${cat}</span>`;
}

function saldoCard(p){
  const{saldo,daPagare,effettivo}=calcola(p);
  const cls=effettivo>=0?"green":"red";
  return `<div class="saldo-card">
    <div class="saldo-label">${p.toUpperCase()}</div>
    <div class="saldo-val">${fmt(saldo)}</div>
    <hr class="saldo-divider"/>
    <div class="saldo-eff-label">Effettivo</div>
    <div class="saldo-eff ${cls}">${fmt(effettivo)}</div>
    <div class="saldo-dp">da pagare: ${fmt(daPagare)}</div>
  </div>`;
}

function progBar(p){
  const fisse=p==="Alex"?S.fisseAlex:S.fisseMonica;
  const tot=fisse.reduce((a,f)=>a+f.importo,0);
  const pag=fisse.filter(f=>f.pagato).reduce((a,f)=>a+f.importo,0);
  const pct=tot>0?Math.round(pag/tot*100):0;
  const col=pct===100?"#059669":"#2563EB";
  return `<div style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;margin-bottom:5px">
      <span style="font-weight:600;font-size:13px">${p}</span>
      <span style="font-size:12px;color:#6B7280">${fmt(pag)} / ${fmt(tot)}</span>
    </div>
    <div class="prog-bar-bg"><div class="prog-bar" style="background:${col};width:${pct}%"></div></div>
    <div style="font-size:11px;color:#9CA3AF;margin-top:3px">${pct}% pagato</div>
  </div>`;
}

function movRow(e,p,showDel=true){
  const col=e.tipo==="USCITA"?"#DC2626":"#059669";
  const seg=e.tipo==="USCITA"?"-":"+";
  const delBtn=showDel?`<button class="btn-ghost btn-xs" style="color:#DC2626;border-color:#FCA5A5;flex-shrink:0" onclick="confirmDel={type:'extra',p:'${p}',id:${e.id}};render()">🗑</button>`:"";
  return `<div class="mov-row">
    <div style="flex:1;min-width:0">
      <div class="mov-desc">${e.desc}</div>
      <div class="mov-meta">
        <span class="mov-date">${p?p+" · ":""}${e.data}</span>
        ${badge(e.cat)}
      </div>
    </div>
    <span class="mov-imp" style="color:${col}">${seg}${fmt(e.importo)}</span>
    ${delBtn}
  </div>`;
}

function panelPersona(p){
  const{saldo,daPagare,effettivo}=calcola(p);
  const fisse=[...(p==="Alex"?S.fisseAlex:S.fisseMonica)].sort((a,b)=>a.giorno-b.giorno);
  const extra=[...(p==="Alex"?S.extraAlex:S.extraMonica)].sort((a,b)=>b.data.localeCompare(a.data));
  const effCls=effettivo>=0?"green":"red";

  // Saldo
  let saldoHtml=`<div class="card">`;
  if(editSaldoMode[p]){
    saldoHtml+=`<div style="font-size:11px;color:#6B7280;font-weight:700;margin-bottom:6px">SALDO ATTUALE</div>
    <div class="row">
      <input id="inp-saldo-${p}" type="number" inputmode="decimal" style="max-width:150px" value="${saldo}" oninput="editSaldoVal['${p}']=this.value"/>
      <button class="btn btn-blue" onclick="aggiornaSaldo('${p}')">✓ Salva</button>
      <button class="btn-ghost" onclick="editSaldoMode['${p}']=false;render()">✕</button>
    </div>`;
  } else {
    saldoHtml+=`<div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div style="flex:1">
        <div style="font-size:11px;color:#6B7280;font-weight:700;margin-bottom:4px">SALDO ATTUALE</div>
        <div style="font-size:24px;font-weight:800;color:#111827;cursor:pointer" onclick="editSaldoVal['${p}']='${saldo}';editSaldoMode['${p}']=true;render()">
          ${fmt(saldo)} <span style="font-size:14px">✏️</span>
        </div>
      </div>
      <div style="text-align:right;padding-left:12px;border-left:1px solid #F3F4F6">
        <div style="font-size:10px;color:#9CA3AF">Effettivo</div>
        <div style="font-size:18px;font-weight:800" class="${effCls}">${fmt(effettivo)}</div>
        <div style="font-size:10px;color:#9CA3AF">da pagare: ${fmt(daPagare)}</div>
      </div>
    </div>`;
  }
  saldoHtml+=`</div>`;

  // Fisse
  let fisseHtml=`<div class="card">
    <div class="section-row">
      <div style="font-weight:700;font-size:15px;flex:1">📌 Spese fisse</div>
      <button class="btn-ghost btn-sm" onclick="if(confirm('Reset mese per ${p}?'))resetMese('${p}')">Reset mese</button>
      <button class="btn btn-green btn-sm" onclick="showAddFissa='${p}';nuovaFissa={nome:'',importo:'',giorno:''};render()">+ Aggiungi</button>
    </div>`;
  if(!fisse.length) fisseHtml+=`<div class="empty">Nessuna spesa fissa.</div>`;
  fisse.forEach(f=>{
    if(editFissa&&editFissa.id===f.id){
      fisseHtml+=`<div class="fissa-row">
        <input type="checkbox" ${f.pagato?"checked":""} onchange="togglePagato('${p}',${f.id})"/>
        <div class="edit-inline">
          <input type="text" value="${f.nome}" oninput="editFissa.nome=this.value" style="flex:2"/>
          <input type="number" class="w-sm" value="${f.importo}" oninput="editFissa.importo=this.value" placeholder="€" inputmode="decimal"/>
          <input type="number" class="w-sm" value="${f.giorno}" oninput="editFissa.giorno=this.value" placeholder="gg" inputmode="numeric"/>
          <button class="btn btn-blue btn-xs" onclick="salvaModFissa('${p}')">✓</button>
          <button class="btn-ghost btn-xs" onclick="editFissa=null;render()">✕</button>
        </div>
      </div>`;
    } else {
      fisseHtml+=`<div class="fissa-row">
        <input type="checkbox" ${f.pagato?"checked":""} onchange="togglePagato('${p}',${f.id})"/>
        <div style="flex:1;min-width:0">
          <div class="fissa-nome${f.pagato?" done":""}">${f.nome}</div>
          <div class="fissa-gg">Giorno ${f.giorno}</div>
        </div>
        <span class="fissa-imp${f.pagato?" done":""}">${fmt(f.importo)}</span>
        <button class="btn-ghost btn-xs" onclick="editFissa={...${JSON.stringify(f)}};render()">✏️</button>
        <button class="btn-ghost btn-xs" style="color:#DC2626;border-color:#FCA5A5" onclick="confirmDel={type:'fissa',p:'${p}',id:${f.id}};render()">🗑</button>
      </div>`;
    }
  });
  if(showAddFissa===p){
    fisseHtml+=`<div class="add-fissa-box">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px">Nuova spesa fissa</div>
      <div class="row" style="gap:6px">
        <input type="text" style="flex:2;min-width:100px" placeholder="Nome" value="${nuovaFissa.nome}" oninput="nuovaFissa.nome=this.value"/>
        <input type="number" style="width:85px" placeholder="€" value="${nuovaFissa.importo}" oninput="nuovaFissa.importo=this.value" inputmode="decimal"/>
        <input type="number" style="width:65px" placeholder="gg" value="${nuovaFissa.giorno}" oninput="nuovaFissa.giorno=this.value" inputmode="numeric"/>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-green" onclick="aggiungiSpesaFissa('${p}')">Aggiungi</button>
        <button class="btn-ghost" onclick="showAddFissa=null;render()">Annulla</button>
      </div>
    </div>`;
  }
  fisseHtml+=`</div>`;

  // Movimenti
  let movHtml=`<div class="card"><div class="card-title">📋 Movimenti (${extra.length})</div>`;
  if(!extra.length) movHtml+=`<div class="empty">Nessun movimento.</div>`;
  extra.forEach(e=>{ movHtml+=movRow(e,null,true).replace("onclick=\"confirmDel={type:'extra',p:'null'","onclick=\"confirmDel={type:'extra',p:'${p}'"); });
  // fix p in delete buttons
  movHtml=movHtml.replace(/p:'null'/g,`p:'${p}'`);
  movHtml+=`</div>`;

  return saldoHtml+fisseHtml+movHtml;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const storico=[
    ...S.extraAlex.map(e=>({...e,persona:"Alex"})),
    ...S.extraMonica.map(e=>({...e,persona:"Monica"})),
  ].sort((a,b)=>b.data.localeCompare(a.data));

  const storicoFilt=filterCat==="Tutte"?storico:storico.filter(e=>e.cat===filterCat);

  let body="";

  if(tab==="dash"){
    body+=`<div class="saldo-grid">${saldoCard("Alex")}${saldoCard("Monica")}</div>`;
    body+=`<div class="card"><div class="card-title">📊 Spese fisse del mese</div>${progBar("Alex")}${progBar("Monica")}</div>`;
    body+=`<div class="card"><div class="card-title">🕐 Ultimi movimenti</div>`;
    if(!storico.length) body+=`<div class="empty">Nessun movimento.</div>`;
    storico.slice(0,7).forEach(e=>{ body+=movRow(e,e.persona,false); });
    body+=`</div>`;
  }

  if(tab==="alex") body=panelPersona("Alex");
  if(tab==="monica") body=panelPersona("Monica");

  if(tab==="nuovo"){
    const iU=formNuovo.tipo==="USCITA";
    body=`<div class="card">
      <div class="card-title">➕ Nuovo movimento</div>
      <div style="margin-bottom:12px">
        <label class="field-label">Persona</label>
        <div class="tog-row">
          <button class="tog" style="background:${formNuovo.persona==="Alex"?"#2563EB":"#F3F4F6"};color:${formNuovo.persona==="Alex"?"#fff":"#374151"}" onclick="formNuovo.persona='Alex';render()">Alex</button>
          <button class="tog" style="background:${formNuovo.persona==="Monica"?"#2563EB":"#F3F4F6"};color:${formNuovo.persona==="Monica"?"#fff":"#374151"}" onclick="formNuovo.persona='Monica';render()">Monica</button>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label class="field-label">Tipo</label>
        <div class="tog-row">
          <button class="tog" style="background:${iU?"#DC2626":"#F3F4F6"};color:${iU?"#fff":"#374151"}" onclick="formNuovo.tipo='USCITA';render()">↑ Uscita</button>
          <button class="tog" style="background:${!iU?"#059669":"#F3F4F6"};color:${!iU?"#fff":"#374151"}" onclick="formNuovo.tipo='ENTRATA';render()">↓ Entrata</button>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label class="field-label">Categoria</label>
        <select onchange="formNuovo.cat=this.value">
          ${CATS.map(c=>`<option value="${c}"${formNuovo.cat===c?" selected":""}>${c}</option>`).join("")}
        </select>
      </div>
      <div style="margin-bottom:12px">
        <label class="field-label">Descrizione</label>
        <input type="text" id="inp-desc" placeholder="es. Spesa Esselunga" value="${formNuovo.desc}" oninput="formNuovo.desc=this.value"/>
      </div>
      <div style="margin-bottom:16px">
        <label class="field-label">Importo (€)</label>
        <input type="number" id="inp-imp" inputmode="decimal" placeholder="0.00" value="${formNuovo.importo}" oninput="formNuovo.importo=this.value"/>
      </div>
      <button class="btn btn-full" style="background:${iU?"#DC2626":"#059669"}" onclick="aggiungiExtra()">
        Registra ${iU?"uscita":"entrata"} per ${formNuovo.persona}
      </button>
    </div>`;
  }

  if(tab==="storico"){
    let chips=["Tutte",...CATS].map(c=>`<button class="chip${filterCat===c?" active":""}" onclick="filterCat='${c}';render()">${c}</button>`).join("");
    body=`<div class="card"><div class="card-title">Filtra categoria</div><div style="display:flex;gap:6px;flex-wrap:wrap">${chips}</div></div>`;
    body+=`<div class="card"><div class="card-title">Tutti i movimenti (${storicoFilt.length})</div>`;
    if(!storicoFilt.length) body+=`<div class="empty">Nessun movimento.</div>`;
    storicoFilt.forEach(e=>{ body+=movRow(e,e.persona,true); });
    body+=`</div>`;
  }

  // Bottom nav
  const nav=NAVS.map(t=>`<button class="nav-btn${tab===t.key?" active":""}" onclick="tab='${t.key}';render()">
    <div class="nav-icon">${t.icon}</div>
    <div class="nav-label">${t.label}</div>
  </button>`).join("");

  // Modale
  let modal="";
  if(confirmDel){
    modal=`<div class="modal-overlay" onclick="if(event.target===this){confirmDel=null;render()}">
      <div class="modal-box">
        <div class="modal-title">Eliminare questa voce?</div>
        <div class="modal-sub">Questa azione aggiornerà il saldo e non è reversibile.</div>
        <div class="row" style="gap:10px">
          <button class="btn btn-red btn-full" onclick="${confirmDel.type==="extra"?`eliminaExtra('${confirmDel.p}',${confirmDel.id})`:`eliminaFissa('${confirmDel.p}',${confirmDel.id})`}">Elimina</button>
          <button class="btn-ghost btn-full" onclick="confirmDel=null;render()">Annulla</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById("app").innerHTML=`
    <div class="header">
      <div class="header-inner">
        <div>
          <div class="header h1" style="font-size:17px;font-weight:800">💰 Bilancio Famiglia</div>
          <div class="header-sub">Alex & Monica</div>
        </div>
        <div class="hbtns">
          <button class="btn btn-dark btn-sm" onclick="esportaJSON()">⬇ Backup</button>
          <label class="btn btn-dark btn-sm" style="cursor:pointer">⬆ Importa<input type="file" accept=".json" style="display:none" onchange="importaJSON(event)"/></label>
        </div>
      </div>
    </div>
    <div class="body">${body}</div>
    <div class="bottom-nav">${nav}</div>
    ${modal}
  `;
}

render();
</script>
</body>
</html>
