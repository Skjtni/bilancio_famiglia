<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#111827"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bilancio"/>
<title>Bilancio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;min-height:100vh;padding-bottom:80px}
input,select,button{font-family:inherit}
::-webkit-scrollbar{display:none}

/* HEADER */
.header{background:#111827;color:#fff;padding:max(env(safe-area-inset-top),14px) 14px 14px;position:sticky;top:0;z-index:10}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header h1{font-size:17px;font-weight:800}
.header-sub{font-size:11px;color:#6B7280;margin-top:1px}
.hbtns{display:flex;gap:6px}

/* SALDO STICKY */
.saldo-strip{display:flex;gap:0;border-top:1px solid #1F2937}
.saldo-pill{flex:1;text-align:center;padding:10px 8px}
.saldo-pill+.saldo-pill{border-left:1px solid #1F2937}
.saldo-pill-label{font-size:10px;color:#9CA3AF;font-weight:600;margin-bottom:2px}
.saldo-pill-val{font-size:18px;font-weight:800;letter-spacing:-0.5px}
.green{color:#34D399}.red{color:#F87171}
.white{color:#fff}

/* BODY */
.body{padding:14px;max-width:600px;margin:0 auto}

/* CARD */
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.card-title{font-weight:700;font-size:15px;margin-bottom:12px}

/* FORM */
label.field-label{font-size:12px;color:#6B7280;font-weight:700;display:block;margin-bottom:5px}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:9px;font-size:15px;outline:none;background:#fff}
input:focus,select:focus{border-color:#2563EB}

/* BUTTONS */
.btn{border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.btn-blue{background:#2563EB}.btn-green{background:#059669}.btn-red{background:#DC2626}.btn-dark{background:#374151}
.btn-ghost{background:none;border:1.5px solid #E5E7EB;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:#374151}
.btn-sm{padding:7px 11px;font-size:12px}
.btn-xs{padding:5px 9px;font-size:12px}
.btn-full{width:100%;padding:13px;font-size:15px}
.tog-row{display:flex;gap:6px;margin-bottom:12px}
.tog{flex:1;border:none;border-radius:9px;padding:10px;font-size:14px;font-weight:700;cursor:pointer}

/* ROWS */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.section-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* FISSE */
.fissa-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #F3F4F6}
.fissa-nome{font-size:14px;font-weight:600;color:#111827}
.fissa-nome.done{color:#9CA3AF;text-decoration:line-through}
.fissa-gg{font-size:11px;color:#9CA3AF}
.fissa-imp{font-weight:700;font-size:14px;color:#374151}
.fissa-imp.done{color:#9CA3AF}
input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:#2563EB;flex-shrink:0}

/* MOVIMENTI */
.mov-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F3F4F6}
.mov-desc{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.mov-date{font-size:10px;color:#9CA3AF}
.mov-imp{font-weight:700;font-size:13px;white-space:nowrap}

/* BADGE */
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.badge-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E5E7EB;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav-btn{flex:1;border:none;background:none;padding:10px 0 8px;cursor:pointer;color:#9CA3AF}
.nav-btn.active{color:#2563EB}
.nav-icon{font-size:20px}
.nav-label{font-size:10px;font-weight:500;margin-top:2px}
.nav-btn.active .nav-label{font-weight:700}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end}
.modal-box{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:24px 20px 36px}
.modal-title{font-weight:700;font-size:16px;margin-bottom:8px}
.modal-sub{color:#6B7280;font-size:14px;margin-bottom:20px}

/* CHIP */
.chip{background:#F3F4F6;color:#374151;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.chip.active{background:#2563EB;color:#fff}

/* EDIT INLINE */
.edit-inline{flex:1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.edit-inline input{width:auto;flex:1;min-width:80px;padding:8px 10px;font-size:13px}
.edit-inline input.w-sm{flex:0 0 70px;min-width:0}

/* GRAFICO */
.chart-wrap{overflow-x:auto;padding-bottom:4px}
.chart-bars{display:flex;align-items:stretch;gap:8px;padding:0 4px}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;min-width:44px}
.bar-val{font-size:10px;font-weight:700;color:#374151;text-align:center;white-space:nowrap;height:16px;display:flex;align-items:flex-end;justify-content:center}
.bar-area{flex:1;display:flex;align-items:flex-end;width:100%;padding-top:4px}
.bar{width:100%;border-radius:6px 6px 0 0;min-height:4px}
.bar-label{font-size:9px;color:#6B7280;text-align:center;line-height:1.2;word-break:break-word;height:28px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.empty{color:#9CA3AF;font-size:13px}
.prog-bar-bg{height:8px;background:#F3F4F6;border-radius:99px}
.prog-bar{height:8px;border-radius:99px}
.add-fissa-box{margin-top:12px;padding:12px;background:#F9FAFB;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── DATI ─────────────────────────────────────────────────────────────────────
const INITIAL={
  saldo:3740.26,
  fisse:[
    {id:1,nome:"Prestito ING",importo:278,giorno:1,pagato:true},
    {id:2,nome:"Assicurazione casa",importo:14,giorno:1,pagato:true},
    {id:3,nome:"Golden Gas",importo:0,giorno:1,pagato:false},
    {id:4,nome:"Assicurazione 500L",importo:93.7,giorno:5,pagato:true},
    {id:5,nome:"Affitto",importo:580,giorno:7,pagato:true},
    {id:6,nome:"PS+",importo:13.99,giorno:8,pagato:true},
    {id:7,nome:"Carta di credito",importo:76.63,giorno:10,pagato:true},
    {id:8,nome:"TIM",importo:50.78,giorno:11,pagato:true},
    {id:9,nome:"Finanziamento 500",importo:42.97,giorno:15,pagato:true},
    {id:10,nome:"NEN",importo:58.82,giorno:17,pagato:true},
  ],
  extra:[
    {id:1,data:"2026-06-01",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:1.03},
    {id:2,data:"2026-06-03",tipo:"USCITA",cat:"Shopping",desc:"Regalo anniversario",importo:178},
    {id:3,data:"2026-06-04",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Colazione",importo:8.7},
    {id:4,data:"2026-06-04",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:15.47},
    {id:5,data:"2026-06-04",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Pizza",importo:50},
    {id:6,data:"2026-06-05",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Colazione",importo:15.9},
    {id:7,data:"2026-06-05",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"Cinema",importo:24},
    {id:8,data:"2026-06-05",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"Popcorn",importo:7},
    {id:9,data:"2026-06-05",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"McDonald's",importo:24.2},
    {id:10,data:"2026-06-08",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:38.89},
    {id:11,data:"2026-06-08",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Benzina",importo:10},
    {id:12,data:"2026-06-09",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:2.83},
    {id:13,data:"2026-06-10",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"Cioccolata",importo:3.58},
    {id:14,data:"2026-06-12",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Benzina",importo:26.01},
    {id:15,data:"2026-06-13",tipo:"USCITA",cat:"Casa/Utenze",desc:"Prolunga",importo:11.7},
    {id:16,data:"2026-06-13",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:29.63},
    {id:17,data:"2026-06-15",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:20.8},
    {id:18,data:"2026-06-15",tipo:"USCITA",cat:"Casa/Utenze",desc:"Brico",importo:4.14},
    {id:19,data:"2026-06-16",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"Gelato",importo:6.8},
    {id:20,data:"2026-06-16",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"Pizza",importo:50},
    {id:21,data:"2026-06-17",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Benzina",importo:15},
    {id:22,data:"2026-06-17",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:5.46},
    {id:23,data:"2026-06-18",tipo:"USCITA",cat:"Altro",desc:"Prelievo",importo:50},
    {id:24,data:"2026-06-18",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"Ristorante",importo:68},
    {id:25,data:"2026-06-19",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Bici",importo:5},
    {id:26,data:"2026-06-19",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Diesel",importo:70.03},
    {id:27,data:"2026-06-20",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:47.58},
    {id:28,data:"2026-06-20",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Ad Blue",importo:18.7},
    {id:29,data:"2026-06-21",tipo:"USCITA",cat:"Trasporti/Auto",desc:"Benzina",importo:58.85},
    {id:30,data:"2026-06-21",tipo:"USCITA",cat:"Altro",desc:"Claude",importo:219.6},
    {id:31,data:"2026-06-22",tipo:"USCITA",cat:"Svago/Ristoranti",desc:"McDonald's",importo:24.9},
    {id:32,data:"2026-06-23",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:1.85},
    {id:33,data:"2026-06-25",tipo:"USCITA",cat:"Altro",desc:"Prelievo",importo:100},
    {id:34,data:"2026-06-25",tipo:"USCITA",cat:"Salute",desc:"Farmacia",importo:37.68},
    {id:35,data:"2026-06-26",tipo:"USCITA",cat:"Cibo/Spesa",desc:"Spesa",importo:10.96},
  ],
  nextId:36,
};

const CATS=["Cibo/Spesa","Svago/Ristoranti","Trasporti/Auto","Casa/Utenze","Shopping","Salute","Altro"];
const CAT_STYLE={
  "Cibo/Spesa":      {bg:"#FEF3C7",tc:"#92400E",dc:"#F59E0B",bar:"#F59E0B"},
  "Svago/Ristoranti":{bg:"#EDE9FE",tc:"#5B21B6",dc:"#7C3AED",bar:"#7C3AED"},
  "Trasporti/Auto":  {bg:"#DBEAFE",tc:"#1E40AF",dc:"#3B82F6",bar:"#3B82F6"},
  "Casa/Utenze":     {bg:"#D1FAE5",tc:"#065F46",dc:"#10B981",bar:"#10B981"},
  "Shopping":        {bg:"#FCE7F3",tc:"#9D174D",dc:"#EC4899",bar:"#EC4899"},
  "Salute":          {bg:"#FEE2E2",tc:"#991B1B",dc:"#EF4444",bar:"#EF4444"},
  "Altro":           {bg:"#F3F4F6",tc:"#374151",dc:"#6B7280",bar:"#6B7280"},
};
const NAVS=[
  {key:"nuovo",icon:"➕",label:"Nuovo"},
  {key:"fisse",icon:"📌",label:"Fisse"},
  {key:"storico",icon:"📋",label:"Storico"},
  {key:"grafico",icon:"📊",label:"Grafico"},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
function loadState(){try{const r=localStorage.getItem("bilancio_v4");if(r)return JSON.parse(r);}catch{}return JSON.parse(JSON.stringify(INITIAL));}
function saveState(s){try{localStorage.setItem("bilancio_v4",JSON.stringify(s));}catch{}}

let S=loadState();
let tab="nuovo";
let filterCat="Tutte";
let confirmDel=null;
let editSaldoMode=false;
let editSaldoVal="";
let showAddFissa=false;
let nuovaFissa={nome:"",importo:"",giorno:""};
let editFissa=null;
let formNuovo={tipo:"USCITA",cat:"Cibo/Spesa",desc:"",importo:""};

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n);
const fmtShort=n=>n>=1000?(n/1000).toFixed(1)+"k":n.toFixed(0);
function oggi(){return new Date().toISOString().split("T")[0];}
function calcSaldo(){
  const daPagare=S.fisse.filter(f=>!f.pagato).reduce((a,f)=>a+f.importo,0);
  return{saldo:S.saldo,daPagare,effettivo:+(S.saldo-daPagare).toFixed(2)};
}

// ── AZIONI ────────────────────────────────────────────────────────────────────
function togglePagato(id){
  const voce=S.fisse.find(f=>f.id===id);
  const delta=voce.pagato?voce.importo:-voce.importo;
  S.fisse=S.fisse.map(f=>f.id===id?{...f,pagato:!f.pagato}:f);
  S.saldo=+(S.saldo-delta).toFixed(2);
  saveState(S);render();
}
function aggiungiExtra(){
  const imp=parseFloat(formNuovo.importo.replace(",","."));
  if(!imp||!formNuovo.desc.trim())return;
  const delta=formNuovo.tipo==="USCITA"?-imp:imp;
  S.extra.unshift({id:S.nextId,data:oggi(),tipo:formNuovo.tipo,cat:formNuovo.cat,desc:formNuovo.desc.trim(),importo:imp});
  S.saldo=+(S.saldo+delta).toFixed(2);
  S.nextId++;
  formNuovo={...formNuovo,desc:"",importo:""};
  saveState(S);render();
}
function eliminaExtra(id){
  const voce=S.extra.find(e=>e.id===id);
  if(!voce)return;
  const delta=voce.tipo==="USCITA"?voce.importo:-voce.importo;
  S.extra=S.extra.filter(e=>e.id!==id);
  S.saldo=+(S.saldo+delta).toFixed(2);
  confirmDel=null;saveState(S);render();
}
function eliminaFissa(id){
  const voce=S.fisse.find(f=>f.id===id);
  if(voce&&voce.pagato)S.saldo=+(S.saldo+voce.importo).toFixed(2);
  S.fisse=S.fisse.filter(f=>f.id!==id);
  confirmDel=null;saveState(S);render();
}
function aggiornaSaldo(){
  const v=parseFloat(editSaldoVal.replace(",","."));
  if(isNaN(v))return;
  S.saldo=v;editSaldoMode=false;saveState(S);render();
}
function aggiungiSpesaFissa(){
  const imp=parseFloat(nuovaFissa.importo.replace(",","."));
  const gio=parseInt(nuovaFissa.giorno);
  if(!nuovaFissa.nome.trim()||isNaN(imp)||isNaN(gio))return;
  S.fisse.push({id:S.nextId,nome:nuovaFissa.nome.trim(),importo:imp,giorno:gio,pagato:false});
  S.nextId++;
  nuovaFissa={nome:"",importo:"",giorno:""};
  showAddFissa=false;saveState(S);render();
}
function salvaModFissa(){
  if(!editFissa)return;
  const imp=parseFloat(String(editFissa.importo).replace(",","."));
  const gio=parseInt(editFissa.giorno);
  if(isNaN(imp)||isNaN(gio)||!editFissa.nome.trim())return;
  S.fisse=S.fisse.map(f=>f.id===editFissa.id?{...f,nome:editFissa.nome,importo:imp,giorno:gio}:f);
  editFissa=null;saveState(S);render();
}
function resetMese(){
  if(!confirm("Azzerare tutte le spunte del mese?"))return;
  S.fisse=S.fisse.map(f=>({...f,pagato:false}));
  saveState(S);render();
}
function esportaJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`bilancio_${oggi()}.json`;a.click();
}
function importaJSON(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{try{S=JSON.parse(ev.target.result);saveState(S);render();}catch{alert("File non valido.");}};
  r.readAsText(file);e.target.value="";
}

// ── HTML ──────────────────────────────────────────────────────────────────────
function badge(cat){
  const c=CAT_STYLE[cat]||CAT_STYLE["Altro"];
  return `<span class="badge" style="background:${c.bg};color:${c.tc}"><span class="badge-dot" style="background:${c.dc}"></span>${cat}</span>`;
}

function movRow(e,showDel=true){
  const col=e.tipo==="USCITA"?"#DC2626":"#059669";
  const seg=e.tipo==="USCITA"?"-":"+";
  const del=showDel?`<button class="btn-ghost btn-xs" style="color:#DC2626;border-color:#FCA5A5;flex-shrink:0" onclick="confirmDel={type:'extra',id:${e.id}};render()">🗑</button>`:"";
  return `<div class="mov-row">
    <div style="flex:1;min-width:0">
      <div class="mov-desc">${e.desc}</div>
      <div class="mov-meta"><span class="mov-date">${e.data}</span>${badge(e.cat)}</div>
    </div>
    <span class="mov-imp" style="color:${col}">${seg}${fmt(e.importo)}</span>
    ${del}
  </div>`;
}

function renderGrafico(){
  const uscite=S.extra.filter(e=>e.tipo==="USCITA");
  const totCat={};
  CATS.forEach(c=>totCat[c]=0);
  uscite.forEach(e=>{if(totCat[e.cat]!==undefined)totCat[e.cat]+=e.importo;});
  const vals=CATS.map(c=>totCat[c]);
  const max=Math.max(...vals,1);

  const bars=CATS.map((c,i)=>{
    const v=vals[i];
    const pct=Math.round((v/max)*160);
    const cs=CAT_STYLE[c];
    return `<div class="bar-col">
      <div class="bar-val">${v>0?"€"+fmtShort(v):""}</div>
      <div class="bar-area"><div class="bar" style="height:${pct}px;background:${cs.bar}"></div></div>
      <div class="bar-label">${c.replace("/","/<br>")}</div>
    </div>`;
  }).join("");

  // Lista dettaglio
  const rows=CATS.filter(c=>totCat[c]>0)
    .sort((a,b)=>totCat[b]-totCat[a])
    .map(c=>{
      const cs=CAT_STYLE[c];
      const pct=Math.round(totCat[c]/uscite.reduce((a,e)=>a+e.importo,0)*100)||0;
      return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F4F6">
        <span style="width:10px;height:10px;border-radius:50%;background:${cs.bar};flex-shrink:0"></span>
        <span style="flex:1;font-size:13px;font-weight:600">${c}</span>
        <span style="font-size:12px;color:#6B7280">${pct}%</span>
        <span style="font-size:14px;font-weight:700">${fmt(totCat[c])}</span>
      </div>`;
    }).join("");

  const totUscite=uscite.reduce((a,e)=>a+e.importo,0);
  return `<div class="card">
    <div class="card-title">📊 Spese per categoria</div>
    <div style="font-size:12px;color:#6B7280;margin-bottom:12px">Totale uscite: <strong style="color:#DC2626">${fmt(totUscite)}</strong></div>
    <div class="chart-wrap"><div class="chart-bars">${bars}</div></div>
  </div>
  <div class="card">${rows||'<div class="empty">Nessuna uscita registrata.</div>'}</div>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const{saldo,daPagare,effettivo}=calcSaldo();
  const effCls=effettivo>=0?"green":"red";

  // Header saldo strip
  let saldoStrip="";
  if(editSaldoMode){
    saldoStrip=`<div class="saldo-strip" style="padding:10px 14px;gap:8px">
      <input id="inp-saldo" type="number" inputmode="decimal" style="flex:1;background:#1F2937;border:1.5px solid #374151;color:#fff;border-radius:9px;padding:8px 12px;font-size:15px;outline:none" value="${saldo}}" oninput="editSaldoVal=this.value"/>
      <button class="btn btn-green btn-sm" onclick="aggiornaSaldo()">✓ Salva</button>
      <button class="btn-ghost btn-sm" style="color:#9CA3AF;border-color:#374151" onclick="editSaldoMode=false;render()">✕</button>
    </div>`;
  } else {
    saldoStrip=`<div class="saldo-strip">
      <div class="saldo-pill" onclick="editSaldoVal='${saldo}';editSaldoMode=true;render()" style="cursor:pointer">
        <div class="saldo-pill-label">SALDO ✏️</div>
        <div class="saldo-pill-val white">${fmt(saldo)}</div>
      </div>
      <div class="saldo-pill">
        <div class="saldo-pill-label">EFFETTIVO</div>
        <div class="saldo-pill-val ${effCls}">${fmt(effettivo)}</div>
      </div>
    </div>`;
  }

  // Body
  let body="";

  if(tab==="nuovo"){
    const iU=formNuovo.tipo==="USCITA";
    body=`<div class="card">
      <div class="card-title">➕ Nuovo movimento</div>
      <div style="margin-bottom:12px">
        <label class="field-label">Tipo</label>
        <div class="tog-row">
          <button class="tog" style="background:${iU?"#DC2626":"#F3F4F6"};color:${iU?"#fff":"#374151"}" onclick="formNuovo.tipo='USCITA';render()">↑ Uscita</button>
          <button class="tog" style="background:${!iU?"#059669":"#F3F4F6"};color:${!iU?"#fff":"#374151"}" onclick="formNuovo.tipo='ENTRATA';render()">↓ Entrata</button>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label class="field-label">Categoria</label>
        <select onchange="formNuovo.cat=this.value">
          ${CATS.map(c=>`<option value="${c}"${formNuovo.cat===c?" selected":""}>${c}</option>`).join("")}
        </select>
      </div>
      <div style="margin-bottom:12px">
        <label class="field-label">Descrizione</label>
        <input type="text" placeholder="es. Spesa Esselunga" value="${formNuovo.desc}" oninput="formNuovo.desc=this.value"/>
      </div>
      <div style="margin-bottom:16px">
        <label class="field-label">Importo (€)</label>
        <input type="number" inputmode="decimal" placeholder="0.00" value="${formNuovo.importo}" oninput="formNuovo.importo=this.value"/>
      </div>
      <button class="btn btn-full" style="background:${iU?"#DC2626":"#059669"}" onclick="aggiungiExtra()">
        Registra ${iU?"uscita":"entrata"}
      </button>
    </div>
    <div class="card">
      <div class="card-title">🕐 Ultimi movimenti</div>
      ${[...S.extra].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5).map(e=>movRow(e,false)).join("")||'<div class="empty">Nessun movimento.</div>'}
    </div>`;
  }

  if(tab==="fisse"){
    const sorted=[...S.fisse].sort((a,b)=>a.giorno-b.giorno);
    const tot=S.fisse.reduce((a,f)=>a+f.importo,0);
    const pag=S.fisse.filter(f=>f.pagato).reduce((a,f)=>a+f.importo,0);
    const pct=tot>0?Math.round(pag/tot*100):0;
    const col=pct===100?"#059669":"#2563EB";

    let fisseRows="";
    sorted.forEach(f=>{
      if(editFissa&&editFissa.id===f.id){
        fisseRows+=`<div class="fissa-row">
          <input type="checkbox" ${f.pagato?"checked":""} onchange="togglePagato(${f.id})"/>
          <div class="edit-inline">
            <input type="text" value="${f.nome}" oninput="editFissa.nome=this.value" style="flex:2"/>
            <input type="number" class="w-sm" value="${f.importo}" oninput="editFissa.importo=this.value" placeholder="€" inputmode="decimal"/>
            <input type="number" class="w-sm" value="${f.giorno}" oninput="editFissa.giorno=this.value" placeholder="gg" inputmode="numeric"/>
            <button class="btn btn-blue btn-xs" onclick="salvaModFissa()">✓</button>
            <button class="btn-ghost btn-xs" onclick="editFissa=null;render()">✕</button>
          </div>
        </div>`;
      } else {
        fisseRows+=`<div class="fissa-row">
          <input type="checkbox" ${f.pagato?"checked":""} onchange="togglePagato(${f.id})"/>
          <div style="flex:1;min-width:0">
            <div class="fissa-nome${f.pagato?" done":""}">${f.nome}</div>
            <div class="fissa-gg">Giorno ${f.giorno}</div>
          </div>
          <span class="fissa-imp${f.pagato?" done":""}">${fmt(f.importo)}</span>
          <button class="btn-ghost btn-xs" onclick="editFissa=${JSON.stringify(f).replace(/"/g,"'")};editFissa=JSON.parse(JSON.stringify(${JSON.stringify(f)}));render()">✏️</button>
          <button class="btn-ghost btn-xs" style="color:#DC2626;border-color:#FCA5A5" onclick="confirmDel={type:'fissa',id:${f.id}};render()">🗑</button>
        </div>`;
      }
    });

    body=`<div class="card">
      <div class="section-row">
        <div style="font-weight:700;font-size:15px;flex:1">📌 Spese fisse</div>
        <button class="btn-ghost btn-sm" onclick="resetMese()">Reset mese</button>
        <button class="btn btn-green btn-sm" onclick="showAddFissa=true;nuovaFissa={nome:'',importo:'',giorno:''};render()">+ Aggiungi</button>
      </div>
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:12px;color:#6B7280">Pagato questo mese</span>
          <span style="font-size:12px;font-weight:700">${fmt(pag)} / ${fmt(tot)}</span>
        </div>
        <div class="prog-bar-bg"><div class="prog-bar" style="background:${col};width:${pct}%"></div></div>
        <div style="font-size:11px;color:#9CA3AF;margin-top:3px">${pct}% pagato · da pagare: ${fmt(daPagare)}</div>
      </div>
      ${fisseRows||'<div class="empty">Nessuna spesa fissa.</div>'}
      ${showAddFissa?`<div class="add-fissa-box">
        <div style="font-weight:700;font-size:13px;margin-bottom:8px">Nuova spesa fissa</div>
        <div class="row" style="gap:6px">
          <input type="text" style="flex:2;min-width:100px" placeholder="Nome" value="${nuovaFissa.nome}" oninput="nuovaFissa.nome=this.value"/>
          <input type="number" style="width:85px" placeholder="€" value="${nuovaFissa.importo}" oninput="nuovaFissa.importo=this.value" inputmode="decimal"/>
          <input type="number" style="width:65px" placeholder="gg" value="${nuovaFissa.giorno}" oninput="nuovaFissa.giorno=this.value" inputmode="numeric"/>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn btn-green" onclick="aggiungiSpesaFissa()">Aggiungi</button>
          <button class="btn-ghost" onclick="showAddFissa=false;render()">Annulla</button>
        </div>
      </div>`:""}
    </div>`;
  }

  if(tab==="storico"){
    const sorted=[...S.extra].sort((a,b)=>b.data.localeCompare(a.data));
    const filt=filterCat==="Tutte"?sorted:sorted.filter(e=>e.cat===filterCat);
    const chips=["Tutte",...CATS].map(c=>`<button class="chip${filterCat===c?" active":""}" onclick="filterCat='${c}';render()">${c}</button>`).join("");
    body=`<div class="card">
      <div class="card-title">Filtra categoria</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${chips}</div>
    </div>
    <div class="card">
      <div class="card-title">Movimenti (${filt.length})</div>
      ${filt.map(e=>movRow(e,true)).join("")||'<div class="empty">Nessun movimento.</div>'}
    </div>`;
  }

  if(tab==="grafico") body=renderGrafico();

  // Nav
  const nav=NAVS.map(t=>`<button class="nav-btn${tab===t.key?" active":""}" onclick="tab='${t.key}';render()">
    <div class="nav-icon">${t.icon}</div>
    <div class="nav-label">${t.label}</div>
  </button>`).join("");

  // Modale
  let modal="";
  if(confirmDel){
    const action=confirmDel.type==="extra"?`eliminaExtra(${confirmDel.id})`:`eliminaFissa(${confirmDel.id})`;
    modal=`<div class="modal-overlay" onclick="if(event.target===this){confirmDel=null;render()}">
      <div class="modal-box">
        <div class="modal-title">Eliminare questa voce?</div>
        <div class="modal-sub">Il saldo verrà aggiornato. Azione non reversibile.</div>
        <div class="row" style="gap:10px">
          <button class="btn btn-red btn-full" onclick="${action}">Elimina</button>
          <button class="btn-ghost btn-full" onclick="confirmDel=null;render()">Annulla</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById("app").innerHTML=`
    <div class="header">
      <div class="header-top">
        <div>
          <div style="font-size:17px;font-weight:800">💰 Bilancio</div>
          <div class="header-sub">Alex Crepaldi</div>
        </div>
        <div class="hbtns">
          <button class="btn btn-dark btn-sm" onclick="esportaJSON()">⬇ Backup</button>
          <label class="btn btn-dark btn-sm" style="cursor:pointer">⬆ Importa<input type="file" accept=".json" style="display:none" onchange="importaJSON(event)"/></label>
        </div>
      </div>
      ${saldoStrip}
    </div>
    <div class="body">${body}</div>
    <div class="bottom-nav">${nav}</div>
    ${modal}
  `;
}

render();
</script>
</body>
</html>
